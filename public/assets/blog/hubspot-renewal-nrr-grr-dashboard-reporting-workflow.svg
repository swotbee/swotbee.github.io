<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" role="img" aria-labelledby="title desc">
<title id="title">Revenue Reporting acceptance gates</title>
<desc id="desc">Frozen cohort: Starting customers and value; Reviewed movements: Expansion, contraction and churn; Controlled grain: No revenue multiplication; Reconciled totals: Independent calculation; Dashboard sign-off: Coverage and drill-down</desc>
<rect width="600" height="850" rx="20" fill="#f2f7f6"/>
<text x="32" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#16383d">Revenue Reporting</text>
<text x="32" y="89" font-family="Arial,sans-serif" font-size="24" fill="#165d63">Acceptance gates</text>
<rect x="30" y="120" width="540" height="108" rx="14" fill="#fff" stroke="#b9ceca"/>
<text x="50" y="159" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#16383d">1. Frozen cohort</text>
<text x="50" y="198" font-family="Arial,sans-serif" font-size="24" fill="#405c60">Starting customers and value</text>
<path d="M300 232 v15 m-7 -7 7 7 7 -7" fill="none" stroke="#a26519" stroke-width="3"/>
<rect x="30" y="255" width="540" height="108" rx="14" fill="#fff" stroke="#b9ceca"/>
<text x="50" y="294" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#16383d">2. Reviewed movements</text>
<text x="50" y="333" font-family="Arial,sans-serif" font-size="24" fill="#405c60">Expansion, contraction and churn</text>
<path d="M300 367 v15 m-7 -7 7 7 7 -7" fill="none" stroke="#a26519" stroke-width="3"/>
<rect x="30" y="390" width="540" height="108" rx="14" fill="#fff" stroke="#b9ceca"/>
<text x="50" y="429" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#16383d">3. Controlled grain</text>
<text x="50" y="468" font-family="Arial,sans-serif" font-size="24" fill="#405c60">No revenue multiplication</text>
<path d="M300 502 v15 m-7 -7 7 7 7 -7" fill="none" stroke="#a26519" stroke-width="3"/>
<rect x="30" y="525" width="540" height="108" rx="14" fill="#fff" stroke="#b9ceca"/>
<text x="50" y="564" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#16383d">4. Reconciled totals</text>
<text x="50" y="603" font-family="Arial,sans-serif" font-size="24" fill="#405c60">Independent calculation</text>
<path d="M300 637 v15 m-7 -7 7 7 7 -7" fill="none" stroke="#a26519" stroke-width="3"/>
<rect x="30" y="660" width="540" height="108" rx="14" fill="#fff" stroke="#b9ceca"/>
<text x="50" y="699" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#16383d">5. Dashboard sign-off</text>
<text x="50" y="738" font-family="Arial,sans-serif" font-size="24" fill="#405c60">Coverage and drill-down</text>
<text x="32" y="830" font-family="Arial,sans-serif" font-size="21" fill="#405c60">Illustrative design, not a product screenshot.</text>
</svg>
