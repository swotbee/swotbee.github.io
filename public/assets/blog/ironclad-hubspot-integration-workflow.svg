<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" role="img" aria-labelledby="title desc">
<title id="title">Ironclad acceptance gates</title>
<desc id="desc">Approved intake: Entity, template and inputs; Identified workflow: Originating CRM and agreement; Reviewed completion: Executed version and terms; Matched CRM return: Correct record and fields; Recoverable exception: No blind relaunch or replay</desc>
<rect width="600" height="850" rx="20" fill="#f2f7f6"/>
<text x="32" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#16383d">Ironclad</text>
<text x="32" y="89" font-family="Arial,sans-serif" font-size="24" fill="#165d63">Acceptance gates</text>
<rect x="30" y="120" width="540" height="108" rx="14" fill="#fff" stroke="#b9ceca"/>
<text x="50" y="159" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#16383d">1. Approved intake</text>
<text x="50" y="198" font-family="Arial,sans-serif" font-size="24" fill="#405c60">Entity, template and inputs</text>
<path d="M300 232 v15 m-7 -7 7 7 7 -7" fill="none" stroke="#a26519" stroke-width="3"/>
<rect x="30" y="255" width="540" height="108" rx="14" fill="#fff" stroke="#b9ceca"/>
<text x="50" y="294" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#16383d">2. Identified workflow</text>
<text x="50" y="333" font-family="Arial,sans-serif" font-size="24" fill="#405c60">Originating CRM and agreement</text>
<path d="M300 367 v15 m-7 -7 7 7 7 -7" fill="none" stroke="#a26519" stroke-width="3"/>
<rect x="30" y="390" width="540" height="108" rx="14" fill="#fff" stroke="#b9ceca"/>
<text x="50" y="429" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#16383d">3. Reviewed completion</text>
<text x="50" y="468" font-family="Arial,sans-serif" font-size="24" fill="#405c60">Executed version and terms</text>
<path d="M300 502 v15 m-7 -7 7 7 7 -7" fill="none" stroke="#a26519" stroke-width="3"/>
<rect x="30" y="525" width="540" height="108" rx="14" fill="#fff" stroke="#b9ceca"/>
<text x="50" y="564" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#16383d">4. Matched CRM return</text>
<text x="50" y="603" font-family="Arial,sans-serif" font-size="24" fill="#405c60">Correct record and fields</text>
<path d="M300 637 v15 m-7 -7 7 7 7 -7" fill="none" stroke="#a26519" stroke-width="3"/>
<rect x="30" y="660" width="540" height="108" rx="14" fill="#fff" stroke="#b9ceca"/>
<text x="50" y="699" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#16383d">5. Recoverable exception</text>
<text x="50" y="738" font-family="Arial,sans-serif" font-size="24" fill="#405c60">No blind relaunch or replay</text>
<text x="32" y="830" font-family="Arial,sans-serif" font-size="21" fill="#405c60">Illustrative design, not a product screenshot.</text>
</svg>
