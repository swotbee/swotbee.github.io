<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">One purchase, three revenue measures</title><desc id="d">A fictional purchase totals 16,500 dollars. Closing annual recurring revenue is 15,000 dollars and recurring growth is 3,000 dollars. One-time fees are excluded from ARR.</desc><rect width="1200" height="630" fill="#fffbeb"/><g font-family="Arial,sans-serif" fill="#292524"><text x="70" y="85" font-size="24" fill="#92400e">SWOTBee</text><text x="70" y="165" font-size="46" font-weight="700">One purchase. Three revenue measures.</text><g font-size="27"><text x="70" y="295">Purchase total</text><text x="475" y="295">Closing ARR</text><text x="875" y="295">ARR growth</text></g><g font-size="53" font-weight="700"><text x="70" y="380">$16,500</text><text x="475" y="380">$15,000</text><text x="875" y="380">$3,000</text></g><path d="M70 440H1130" stroke="#d97706" stroke-width="4"/><text x="70" y="512" font-size="26">Renewal $12,000 + expansion $3,000 + one-time fee $1,500</text><text x="70" y="567" font-size="23">Count each contribution once. Fictional one-year example.</text></g></svg>
