<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">One three-year agreement with three dated prices</title><desc id="desc">Year one costs 12,000 dollars, year two 13,200 dollars, and year three 14,520 dollars. Total commitment is 39,720 dollars.</desc>
<rect width="1200" height="630" fill="#fffbeb"/><text x="80" y="94" font-family="Arial,sans-serif" font-size="24" fill="#92400e">SWOTBee</text>
<text x="80" y="180" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#1c1917">One agreement. Three annual prices.</text>
<g font-family="Arial,sans-serif" fill="#1c1917"><path d="M100 362H1100" stroke="#d97706" stroke-width="6"/>
<g><circle cx="180" cy="362" r="12" fill="#d97706"/><text x="115" y="312" font-size="24">2027</text><text x="115" y="430" font-size="38" font-weight="700">$12,000</text></g>
<g><circle cx="560" cy="362" r="12" fill="#d97706"/><text x="495" y="312" font-size="24">2028</text><text x="495" y="430" font-size="38" font-weight="700">$13,200</text></g>
<g><circle cx="940" cy="362" r="12" fill="#d97706"/><text x="875" y="312" font-size="24">2029</text><text x="875" y="430" font-size="38" font-weight="700">$14,520</text></g>
<text x="80" y="550" font-size="28">Total commitment: $39,720 before tax, fees and usage</text></g></svg>
