<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" role="img" aria-labelledby="title desc">
<title id="title">Xero acceptance gates</title>
<desc id="desc">Origin and identity: Invoice ID and creating system; Required dependencies: Customer and product records; Correct amounts: Subtotal, tax and currency; Payment allocation: Invoice balance and adjustments; Exception review: Same identity, safe recovery</desc>
<rect width="600" height="850" rx="20" fill="#f2f7f6"/>
<text x="32" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#16383d">Xero</text>
<text x="32" y="89" font-family="Arial,sans-serif" font-size="24" fill="#165d63">Acceptance gates</text>
<rect x="30" y="120" width="540" height="108" rx="14" fill="#fff" stroke="#b9ceca"/>
<text x="50" y="159" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#16383d">1. Origin and identity</text>
<text x="50" y="198" font-family="Arial,sans-serif" font-size="24" fill="#405c60">Invoice ID and creating system</text>
<path d="M300 232 v15 m-7 -7 7 7 7 -7" fill="none" stroke="#a26519" stroke-width="3"/>
<rect x="30" y="255" width="540" height="108" rx="14" fill="#fff" stroke="#b9ceca"/>
<text x="50" y="294" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#16383d">2. Required dependencies</text>
<text x="50" y="333" font-family="Arial,sans-serif" font-size="24" fill="#405c60">Customer and product records</text>
<path d="M300 367 v15 m-7 -7 7 7 7 -7" fill="none" stroke="#a26519" stroke-width="3"/>
<rect x="30" y="390" width="540" height="108" rx="14" fill="#fff" stroke="#b9ceca"/>
<text x="50" y="429" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#16383d">3. Correct amounts</text>
<text x="50" y="468" font-family="Arial,sans-serif" font-size="24" fill="#405c60">Subtotal, tax and currency</text>
<path d="M300 502 v15 m-7 -7 7 7 7 -7" fill="none" stroke="#a26519" stroke-width="3"/>
<rect x="30" y="525" width="540" height="108" rx="14" fill="#fff" stroke="#b9ceca"/>
<text x="50" y="564" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#16383d">4. Payment allocation</text>
<text x="50" y="603" font-family="Arial,sans-serif" font-size="24" fill="#405c60">Invoice balance and adjustments</text>
<path d="M300 637 v15 m-7 -7 7 7 7 -7" fill="none" stroke="#a26519" stroke-width="3"/>
<rect x="30" y="660" width="540" height="108" rx="14" fill="#fff" stroke="#b9ceca"/>
<text x="50" y="699" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#16383d">5. Exception review</text>
<text x="50" y="738" font-family="Arial,sans-serif" font-size="24" fill="#405c60">Same identity, safe recovery</text>
<text x="32" y="830" font-family="Arial,sans-serif" font-size="21" fill="#405c60">Illustrative design, not a product screenshot.</text>
</svg>
