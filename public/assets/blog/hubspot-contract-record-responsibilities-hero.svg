<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">One agreement, clear record responsibilities</title><desc id="d">Documents hold agreed terms, the deal tracks the opportunity, the Contract manages the commitment and billing records show charges and payments.</desc><rect width="1200" height="630" fill="#fffbeb"/><g font-family="Arial,sans-serif" fill="#292524"><text x="70" y="85" font-size="24" fill="#92400e">SWOTBee</text><text x="70" y="165" font-size="46" font-weight="700">Which record owns each fact?</text><g font-size="29" font-weight="700"><text x="90" y="280">Documents</text><text x="665" y="280">Deal</text><text x="90" y="450">Contract</text><text x="665" y="450">Billing records</text></g><g font-size="25"><text x="90" y="327">Agreed terms and source version</text><text x="665" y="327">Sales opportunity and outcome</text><text x="90" y="497">Commercial commitment</text><text x="665" y="497">Invoices and payment activity</text></g><path d="M70 212H1130M70 375H1130" stroke="#d97706" stroke-width="3"/><text x="70" y="584" font-size="23">Keep each agreement identifiable across the records.</text></g></svg>
