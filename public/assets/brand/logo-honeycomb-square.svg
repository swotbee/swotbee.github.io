<!--
  SWOTbee honeycomb mark, square master.

  Same seven hexagons as src/components/astro/LogoHoneycomb.astro (the mark
  used in the site header). Only the viewBox differs.

  The component uses viewBox="0 0 120 110", but the artwork actually occupies
  x 5..105 and y 8..110, so it sits off-centre and touches the bottom edge.
  Anything square rendered from it came out clipped along the bottom, which is
  why the old favicons looked cut off.

  This viewBox is "-5 -1 120 120": square, and centred on the artwork with an
  even 10 units of air on the left/right and 9 on the top/bottom. Every PNG
  icon in public/ is rendered from this file.

  Colours are the v6 palette and match the header mark exactly.
-->
<svg
  viewBox="-5 -1 120 120"
  width="120"
  height="120"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="SWOTbee"
>
  <polygon points="38,8 54,18 54,36 38,46 22,36 22,18" fill="#D4960A" />
  <polygon points="72,8 88,18 88,36 72,46 56,36 56,18" fill="#0A3D6B" />
  <polygon points="21,40 37,50 37,68 21,78 5,68 5,50" fill="#5AAB9D" />
  <polygon points="55,40 71,50 71,68 55,78 39,68 39,50" fill="#D4960A" />
  <polygon points="89,40 105,50 105,68 89,78 73,68 73,50" fill="#1A7AB5" />
  <polygon points="38,72 54,82 54,100 38,110 22,100 22,82" fill="#3D8A7A" />
  <polygon points="72,72 88,82 88,100 72,110 56,100 56,82" fill="#C48800" />
</svg>
