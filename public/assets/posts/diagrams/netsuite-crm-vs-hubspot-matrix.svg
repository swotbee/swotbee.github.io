<svg width="800" height="360" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="Capability matrix comparing HubSpot and NetSuite CRM" font-family="DM Sans, Segoe UI, sans-serif"><rect width="800" height="360" fill="#f7f5f1"/><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#C47A2A"/></marker></defs><text x="400" y="34" font-size="19" fill="#213343" font-weight="700" text-anchor="middle">NetSuite CRM vs HubSpot</text><text x="180" y="68" font-size="14" fill="#1A7AB5" font-weight="700" text-anchor="middle">HubSpot</text><text x="620" y="68" font-size="14" fill="#C47A2A" font-weight="700" text-anchor="middle">NetSuite CRM</text><text x="400" y="108" font-size="12" fill="#2b3a47" font-weight="600" text-anchor="middle">Marketing automation</text><rect x="70" y="86" width="150" height="34" rx="8" fill="#1A7AB5" stroke="none" stroke-width="1.5"/><rect x="580" y="86" width="150" height="34" rx="8" fill="#e0ddd5" stroke="none" stroke-width="1.5"/><text x="145" y="108" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">strong</text><text x="400" y="152" font-size="12" fill="#2b3a47" font-weight="600" text-anchor="middle">Ease of use / adoption</text><rect x="70" y="130" width="150" height="34" rx="8" fill="#1A7AB5" stroke="none" stroke-width="1.5"/><rect x="580" y="130" width="150" height="34" rx="8" fill="#e0ddd5" stroke="none" stroke-width="1.5"/><text x="145" y="152" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">strong</text><text x="400" y="196" font-size="12" fill="#2b3a47" font-weight="600" text-anchor="middle">Forecasting vs financials</text><rect x="70" y="174" width="150" height="34" rx="8" fill="#e0ddd5" stroke="none" stroke-width="1.5"/><rect x="580" y="174" width="150" height="34" rx="8" fill="#C47A2A" stroke="none" stroke-width="1.5"/><text x="655" y="196" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">strong</text><text x="400" y="240" font-size="12" fill="#2b3a47" font-weight="600" text-anchor="middle">Single source of truth</text><rect x="70" y="218" width="150" height="34" rx="8" fill="#e0ddd5" stroke="none" stroke-width="1.5"/><rect x="580" y="218" width="150" height="34" rx="8" fill="#C47A2A" stroke="none" stroke-width="1.5"/><text x="655" y="240" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">strong</text><text x="400" y="284" font-size="12" fill="#2b3a47" font-weight="600" text-anchor="middle">Time to value</text><rect x="70" y="262" width="150" height="34" rx="8" fill="#1A7AB5" stroke="none" stroke-width="1.5"/><rect x="580" y="262" width="150" height="34" rx="8" fill="#e0ddd5" stroke="none" stroke-width="1.5"/><text x="145" y="284" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">strong</text><text x="400" y="320" font-size="12" fill="#6b7785" font-weight="400" text-anchor="middle">Most mid-market teams run both, integrated</text></svg>