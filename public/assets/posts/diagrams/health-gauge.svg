<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 170' role='img' aria-label='Renewal health score bands' font-family='Hanken Grotesk, DM Sans, Arial, sans-serif'>
<rect width='640' height='170' fill='white'/>
<text x='320' y='28' font-size='16' fill='#213343' text-anchor='middle' font-weight='700'>Renewal Health Score</text>
<rect x='70' y='70' width='140' height='46' rx='8' fill='#c0563b' stroke='none'/>
<text x='140' y='98' font-size='13' fill='white' text-anchor='middle' font-weight='700'>At Risk</text>
<rect x='250' y='70' width='140' height='46' rx='8' fill='#D4960A' stroke='none'/>
<text x='320' y='98' font-size='13' fill='white' text-anchor='middle' font-weight='700'>Neutral</text>
<rect x='430' y='70' width='140' height='46' rx='8' fill='#5AAB9D' stroke='none'/>
<text x='500' y='98' font-size='13' fill='white' text-anchor='middle' font-weight='700'>Healthy</text>
<text x='320' y='150' font-size='11.5' fill='#7a8087' text-anchor='middle' font-weight='400'>Usage + support + NPS + engagement -> one score that flags renewal risk</text>
</svg>
