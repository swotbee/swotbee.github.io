<svg width="800" height="320" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="Customer retention KPIs leading versus lagging" font-family="DM Sans, Segoe UI, sans-serif"><rect width="800" height="320" fill="#f7f5f1"/><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#C47A2A"/></marker></defs><text x="400" y="32" font-size="17" fill="#213343" font-weight="700" text-anchor="middle">Customer Retention KPIs: Leading vs Lagging</text><text x="210" y="66" font-size="13" fill="#5AAB9D" font-weight="700" text-anchor="middle">LEADING (predict)</text><text x="600" y="66" font-size="13" fill="#C47A2A" font-weight="700" text-anchor="middle">LAGGING (report)</text><rect x="70" y="86" width="280" height="40" rx="8" fill="#5AAB9D" stroke="none" stroke-width="1.5"/><text x="210" y="111" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">Product usage</text><rect x="70" y="134" width="280" height="40" rx="8" fill="#5AAB9D" stroke="none" stroke-width="1.5"/><text x="210" y="159" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">Health score</text><rect x="70" y="182" width="280" height="40" rx="8" fill="#5AAB9D" stroke="none" stroke-width="1.5"/><text x="210" y="207" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">NPS</text><rect x="450" y="86" width="280" height="40" rx="8" fill="#C47A2A" stroke="none" stroke-width="1.5"/><text x="590" y="111" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">Retention rate</text><rect x="450" y="134" width="280" height="40" rx="8" fill="#C47A2A" stroke="none" stroke-width="1.5"/><text x="590" y="159" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">Churn rate</text><rect x="450" y="182" width="280" height="40" rx="8" fill="#C47A2A" stroke="none" stroke-width="1.5"/><text x="590" y="207" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">NRR / GRR</text><rect x="450" y="230" width="280" height="40" rx="8" fill="#C47A2A" stroke="none" stroke-width="1.5"/><text x="590" y="255" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">Lifetime value</text><line x1="352" y1="150" x2="448" y2="150" stroke="#6b7785" stroke-width="2.5" marker-end="url(#ah)"/><text x="400" y="300" font-size="12" fill="#6b7785" font-weight="400" text-anchor="middle">Pair leading signals (act early) with lagging scoreboard (benchmark)</text></svg>