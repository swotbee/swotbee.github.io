e">Expansion</text><text x="677.0" y="178" font-size="11.5" fill="#fff" font-weight="400" text-anchor="middle">grow each account</text><text x="400" y="235" font-size="12" fill="#6b7785" font-weight="400" text-anchor="middle">Retention is earned across the lifecycle, not won at renewal</text></svg>