<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-label="Seven HubSpot NetSuite data mapping pitfalls" font-family="DM Sans, Segoe UI, sans-serif"><rect width="800" height="330" fill="#f7f5f1"/><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#C47A2A"/></marker></defs><text x="400" y="34" font-size="18" fill="#213343" font-weight="700" text-anchor="middle">7 HubSpot NetSuite Data Mapping Pitfalls</text><rect x="50" y="70" width="222" height="52" rx="10" fill="#1A7AB5" stroke="none" stroke-width="1.5"/><text x="84" y="101" font-size="18" fill="#ffffff" font-weight="800" text-anchor="middle">1</text><text x="102" y="101" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="start">Line item / catalog mismatch</text><rect x="290" y="70" width="222" height="52" rx="10" fill="#5AAB9D" stroke="none" stroke-width="1.5"/><text x="324" y="101" font-size="18" fill="#ffffff" font-weight="800" text-anchor="middle">2</text><text x="342" y="101" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="start">Company should exist block</text><rect x="530" y="70" width="222" height="52" rx="10" fill="#D4960A" stroke="none" stroke-width="1.5"/><text x="564" y="101" font-size="18" fill="#ffffff" font-weight="800" text-anchor="middle">3</text><text x="582" y="101" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="start">Midnight UTC date shift</text><rect x="50" y="136" width="222" height="52" rx="10" fill="#C47A2A" stroke="none" stroke-width="1.5"/><text x="84" y="167" font-size="18" fill="#ffffff" font-weight="800" text-anchor="middle">4</text><text x="102" y="167" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="start">Dropdown type constraints</text><rect x="290" y="136" width="222" height="52" rx="10" fill="#213343" stroke="none" stroke-width="1.5"/><text x="324" y="167" font-size="18" fill="#ffffff" font-weight="800" text-anchor="middle">5</text><text x="342" y="167" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="start">Ambiguous data ownership</text><rect x="530" y="136" width="222" height="52" rx="10" fill="#b3431f" stroke="none" stroke-width="1.5"/><text x="564" y="167" font-size="18" fill="#ffffff" font-weight="800" text-anchor="middle">6</text><text x="582" y="167" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="start">SOAP timeouts on big orders</text><rect x="50" y="202" width="222" height="52" rx="10" fill="#1A7AB5" stroke="none" stroke-width="1.5"/><text x="84" y="233" font-size="18" fill="#ffffff" font-weight="800" text-anchor="middle">7</text><text x="102" y="233" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="start">Multi-subsidiary isolation</text><text x="400" y="286" font-size="12" fill="#6b7785" font-weight="400" text-anchor="middle">Map the data model deliberately before the sync goes live</text></svg>