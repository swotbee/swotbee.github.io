<rect x='268' y='70' width='100' height='64' rx='8' fill='#D4960A' stroke='none'/>
<text x='318.0' y='98' font-size='12' fill='white' text-anchor='middle' font-weight='600'>Emails</text>
<text x='318.0' y='114' font-size='12' fill='white' text-anchor='middle' font-weight='600'>unanswered</text>
