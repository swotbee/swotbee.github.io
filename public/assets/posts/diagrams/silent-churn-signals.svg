<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 185' role='img' aria-label='Silent churn warning signs timeline' font-family='Hanken Grotesk, DM Sans, Arial, sans-serif'>
<rect width='640' height='185' fill='white'/>
