<text x='320' y='28' font-size='17' fill='#213343' text-anchor='middle' font-weight='700'>Silent Churn: The Warning Signs</text>
<rect x='30' y='70' width='100' height='64' rx='8' fill='#5AAB9D' stroke='none'/>
<text x='80.0' y='98' font-size='12' fill='white' text-anchor='middle' font-weight='600'>Usage</text>
<text x='80.0' y='114' font-size='12' fill='white' text-anchor='middle' font-weight='600'>declines</text>
