<svg width="800" height="360" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="HubSpot total cost of ownership headline versus real" font-family="DM Sans, Segoe UI, sans-serif"><rect width="800" height="360" fill="#f7f5f1"/><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#C47A2A"/></marker></defs><text x="400" y="32" font-size="17" fill="#213343" font-weight="700" text-anchor="middle">HubSpot Cost at Scale: Headline vs Real</text><rect x="170" y="250" width="120" height="60" rx="6" fill="#e0ddd5" stroke="none" stroke-width="1.5"/><text x="230" y="285" font-size="12" fill="#2b3a47" font-weight="700" text-anchor="middle">Headline</text><text x="230" y="235" font-size="13" fill="#6b7785" font-weight="700" text-anchor="middle">$68k</text><rect x="510" y="190" width="120" height="120" rx="4" fill="#1A7AB5" stroke="none" stroke-width="1.5"/><text x="570" y="254.0" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">Seats</text><rect x="510" y="130" width="120" height="60" rx="4" fill="#5AAB9D" stroke="none" stroke-width="1.5"/><text x="570" y="164.0" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">Contact tiers</text><rect x="510" y="90" width="120" height="40" rx="4" fill="#D4960A" stroke="none" stroke-width="1.5"/><text x="570" y="114.0" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">Onboarding</text><rect x="510" y="60" width="120" height="30" rx="4" fill="#C47A2A" stroke="none" stroke-width="1.5"/><text x="570" y="79.0" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">Add-ons</text><text x="570" y="48" font-size="13" fill="#213343" font-weight="700" text-anchor="middle">$110k (3-yr)</text><line x1="300" y1="260" x2="505" y2="200" stroke="#6b7785" stroke-width="2.5" marker-end="url(#ah)"/><text x="400" y="340" font-size="12" fill="#6b7785" font-weight="400" text-anchor="middle">~62% over the naive