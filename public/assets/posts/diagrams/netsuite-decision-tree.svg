<svg width="800" height="360" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="Decision tree: integrate, migrate, or maintain HubSpot and NetSuite" font-family="DM Sans, Segoe UI, sans-serif"><rect width="800" height="360" fill="#f7f5f1"/><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#C47A2A"/></marker></defs><text x="400" y="34" font-size="19" fill="#213343" font-weight="700" text-anchor="middle">Integrate, Migrate, or Maintain?</text><rect x="300" y="56" width="200" height="40" rx="10" fill="#213343" stroke="none" stroke-width="1.5"/><text x="400" y="81" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">Do both systems carry load?</text><line x1="360" y1="96" x2="170" y2="140" stroke="#C47A2A" stroke-width="2.5" marker-end="url(#ah)"/><line x1="440" y1="96" x2="630" y2="140" stroke="#C47A2A" stroke-width="2.5" marker-end="url(#ah)"/><rect x="70" y="142" width="200" height="46" rx="10" fill="#1A7AB5" stroke="none" stroke-width="1.5"/><text x="170" y="162" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">Yes: both load-bearing</text><text x="170" y="180" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">INTEGRATE the two</text><rect x="530" y="142" width="210" height="46" rx="10" fill="#5AAB9D" stroke="none" stroke-width="1.5"/><text x="635" y="162" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">No: CRM adoption fails</text><text x="635" y="180" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">MIGRATE CRM to HubSpot</text><line x1="170" y1="188" x2="170" y2="228" stroke="#C47A2A" stroke-width="2.5" marker-end="url(#ah)"/><line x1="635" y1="188" x2="635" y2="228" stroke="#C47A2A" stroke-width="2.5" marker-end="url(#ah)"/><rect x="60" y="230" width="220" height="60" rx="10" fill="#ffffff" stroke="#e0ddd5" stroke-width="1.5"/><text x="170" y="255" font-size="12" fill="#2b3a47" font-weight="600" text-anchor="middle">Connect HubSpot CRM</text><text x="170" y="274" font-size="11" fill="#6b7785" font-weight="400" text-anchor="middle">and NetSuite ERP, sync data</text><rect x="525" y="230" width="220" height="60" rx="10" fill="#ffffff" stroke="#e0ddd5" stroke-width="1.5"/><text x="635" y="255" font-size="12" fill="#2b3a47" font-weight="600" text-anchor="middle">Keep NetSuite for finance,</text><text x="635" y="274" font-size="11" fill="#6b7785" font-weight="400" text-anchor="middle">rebuild workflows in HubSpot</text><rect x="300" y="300" width="200" height="46" rx="10" fill="#C47A2A" stroke="none" stroke-width="1.5"/><text x="400" y="320" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">Low volume?</text><text x="400" y="338" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">MAINTAIN status quo</text><line x1="360" y1="260" x2="360" y2="323" stroke="#6b7785" stroke-width="2.5" marker-end="url(#ah)"/><line x1="440" y1="323" x2="440" y2="260" stroke="#6b7785" stroke-width="2.5" marker-end="url(#ah)"/></svg>