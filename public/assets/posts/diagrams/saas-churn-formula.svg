<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="SaaS churn rate formula and benchmarks" font-family="DM Sans, Segoe UI, sans-serif"><rect width="800" height="320" fill="#f7f5f1"/><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#C47A2A"/></marker></defs><text x="400" y="32" font-size="17" fill="#213343" font-weight="700" text-anchor="middle">SaaS Churn Rate: Formula and Benchmarks</text><rect x="80" y="70" width="640" height="56" rx="10" fill="#213343" stroke="none" stroke-width="1.5"/><text x="400" y="104" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">Churn rate = (customers lost / customers at start) x 100</text><text x="250" y="178" font-size="12.5" fill="#2b3a47" font-weight="400" text-anchor="end">Best-in-class B2B</text><rect x="260" y="160" width="60" height="26" rx="5" fill="#5AAB9D" stroke="none" stroke-width="1.5"/><text x="354" y="178" font-size="12" fill="#6b7785" font-weight="700" text-anchor="middle"><5%</text><text x="250" y="220" font-size="12.5" fill="#2b3a47" font-weight="400" text-anchor="end">Enterprise B2B SaaS</text><rect x="260" y="202" width="90" height="26" rx="5" fill="#1A7AB5" stroke="none" stroke-width="1.5"/><text x="384" y="220" font-size="12" fill="#6b7785" font-weight="700" text-anchor="middle">5-7%</text><text x="250" y="262" font-size="12.5" fill="#2b3a47" font-weight="400" text-anchor="end">SMB SaaS</text><rect x="260" y="244" width="170" height="26" rx="5" fill="#D4960A" stroke="none" stroke-width="1.5"/><text x="464" y="262" font-size="12" fill="#6b7785" font-weight="700" text-anchor="middle">10-15%</text><text x="400" y="295" font-size="11.5" fill="#6b7785" font-weight="400" text-anchor="middle">Negative churn: expansion exceeds losses, so revenue grows with zero new customers</text></svg>