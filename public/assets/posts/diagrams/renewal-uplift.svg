<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 220' role='img' aria-label='Renewal uplift pricing' font-family='Hanken Grotesk, DM Sans, Arial, sans-serif'>
<rect width='640' height='220' fill='white'/>
<text x='320' y='28' font-size='16' fill='#213343' text-anchor='middle' font-weight='700'>Renewal Uplift</text>
<rect x='150' y='120' width='90' height='40' rx='8' fill='#5AAB9D' stroke='none'/>
<text x='195' y='145' font-size='12' fill='white' text-anchor='middle' font-weight='700'>This year</text>
<text x='195' y='108' font-size='12' fill='#5AAB9D' text-anchor='middle' font-weight='400'>100</text>
<rect x='330' y='104' width='90' height='56' rx='8' fill='#C47A2A' stroke='none'/>
<text x='375' y='129' font-size='12' fill='white' text-anchor='middle' font-weight='700'>Renewal</text>
<text x='375' y='92' font-size='12' fill='#C47A2A' text-anchor='middle' font-weight='400'>105-107</text>
<text x='375' y='176' font-size='11' fill='#7a8087' text-anchor='middle' font-weight='400'>+5-7% uplift</text>
<line x1='110' y1='160' x2='460' y2='160' stroke='#e3ddd2' stroke-width='1.5'/>
<text x='320' y='200' font-size='11.5' fill='#7a8087' text-anchor='middle' font-weight='400'>A standard annual uplift, applied at the line-item level, is defensible</text>
</svg>
