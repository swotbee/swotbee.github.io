<svg width="800" height="320" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="What data syncs between HubSpot and NetSuite" font-family="DM Sans, Segoe UI, sans-serif"><rect width="800" height="320" fill="#f7f5f1"/><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#C47A2A"/></marker></defs><text x="400" y="32" font-size="16" fill="#213343" font-weight="700" text-anchor="middle">What Syncs Between HubSpot and NetSuite</text><text x="190" y="66" font-size="13" fill="#1A7AB5" font-weight="700" text-anchor="middle">HubSpot</text><text x="610" y="66" font-size="13" fill="#C47A2A" font-weight="700" text-anchor="middle">NetSuite</text><rect x="70" y="88" width="230" height="38" rx="8" fill="#fff" stroke="#1A7AB5" stroke-width="1.5"/><text x="185" y="112" font-size="12" fill="#2b3a47" font-weight="600" text-anchor="middle">Contact / Company</text><rect x="500" y="88" width="230" height="38" rx="8" fill="#fff" stroke="#C47A2A" stroke-width="1.5"/><text x="615" y="112" font-size="12" fill="#2b3a47" font-weight="600" text-anchor="middle">Customer</text><line x1="302" y1="101" x2="498" y2="101" stroke="#5AAB9D" stroke-width="2.5" marker-end="url(#ah)"/><line x1="498" y1="114" x2="302" y2="114" stroke="#5AAB9D" stroke-width="2.5" marker-end="url(#ah)"/><rect x="70" y="134" width="230" height="38" rx="8" fill="#fff" stroke="#1A7AB5" stroke-width="1.5"/><text x="185" y="158" font-size="12" fill="#2b3a47" font-weight="600" text-anchor="middle">Deal (closed-won)</text><rect x="500" y="134" width="230" height="38" rx="8" fill="#fff" stroke="#C47A2A" stroke-width="1.5"/><text x="615" y="158" font-size="12" fill="#2b3a47" font-weight="600" text-anchor="middle">Sales order</text><line x1="302" y1="153" x2="498" y2="153" stroke="#D4960A" stroke-width="2.5" marker-end="url(#ah)"/><rect x="70" y="180" width="230" height="38" rx="8" fill="#fff" stroke="#1A7AB5" stroke-width="1.5"/><text