<svg width='640' height='245' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 245' role='img' aria-label='LTV to CAC ratio' font-family='Hanken Grotesk, DM Sans, Arial, sans-serif'>
<rect width='640' height='245' fill='white'/>
<text x='320' y='28' font-size='17' fill='#213343' text-anchor='middle' font-weight='700'>LTV : CAC and Payback</text>
<rect x='150' y='150' width='90' height='30' rx='8' fill='#C47A2A' stroke='none'/>
<text x='195' y='200' font-size='13' fill='#213343' text-anchor='middle' font-weight='700'>CAC</text>
<text x='195' y='142' font-size='12' fill='#C47A2A' text-anchor='middle' font-weight='700'>1x</text>
<rect x='330' y='90' width='90' height='90' rx='8' fill='#5AAB9D' stroke='none'/>
<text x='375' y='200' font-size='13' fill='#213343' text-anchor='middle' font-weight='700'>LTV</text>
<text x='375' y='82' font-size='12' fill='#5AAB9D' text-anchor='middle' font-weight='700'>3x</text>
<line x1='110' y1='180' x2='470' y2='180' stroke='#e3ddd2' stroke-width='1.5'/>
<text x='320' y='230' font-size='11.5' fill='#7a8087' text-anchor='middle' font-weight='400'>3:1 is the healthy benchmark; high CAC needs longer renewals to pay back</text>
</svg>
