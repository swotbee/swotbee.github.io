<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 250' role='img' aria-label='GRR versus NRR comparison' font-family='Hanken Grotesk, DM Sans, Arial, sans-serif'>
<rect width='640' height='250' fill='white'/>
<text x='320' y='28' font-size='17' fill='#213343' text-anchor='middle' font-weight='700'>Gross vs Net Revenue Retention</text>
<rect x='120' y='82' width='90' height='88' rx='8' fill='#1A7AB5' stroke='none'/>
<text x='165' y='188' font-size='14' fill='#213343' text-anchor='middle' font-weight='700'>GRR</text>
<text x='165' y='74' font-size='14' fill='#1A7AB5' text-anchor='middle' font-weight='700'>88%</text>
<text x='165' y='204' font-size='11' fill='#7a8087' text-anchor='middle' font-weight='400'>keeps revenue</text>
<rect x='360' y='82' width='90' height='88' rx='8' fill='#1A7AB5' stroke='none'/>
<rect x='360' y='60' width='90' height='22' rx='8' fill='#C47A2A' stroke='none'/>
<text x='405' y='188' font-size='14' fill='#213343' text-anchor='middle' font-weight='700'>NRR</text>
<text x='405' y='52' font-size='14' fill='#C47A2A' text-anchor='middle' font-weight='700'>110%</text>
<text x='405' y='204' font-size='11' fill='#7a8087' text-anchor='middle' font-weight='400'>+ expansion</text>
<line x1='80' y1='170' x2='500' y2='170' stroke='#e3ddd2' stroke-width='1.5'/>
<line x1='80' y1='70' x2='500' y2='70' stroke='#7a8087' stroke-width='1' stroke-dasharray='4 3'/>
<text x='520' y='70' font-size='11' fill='#7a8087' text-anchor='start' font-weight='400'>100%</text>
<text x='320' y='228' font-size='12.5' fill='#7a8087' text-anchor='middle' font-weight='400'>The gap between GRR and NRR is your expansion engine</text>
</svg>
