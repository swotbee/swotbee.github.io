<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" role="img" aria-label="Three stages of growth-driven design" font-family="DM Sans, Segoe UI, sans-serif"><rect width="800" height="290" fill="#f7f5f1"/><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#C47A2A"/></marker></defs><text x="400" y="32" font-size="17" fill="#213343" font-weight="700" text-anchor="middle">The Three Stages of Growth-Driven Design</text><rect x="60" y="130" width="210" height="84" rx="12" fill="#1A7AB5" stroke="none" stroke-width="1.5"/><text x="165.0" y="156" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">Strategy</text><text x="165.0" y="174" font-size="11" fill="#fff" font-weight="400" text-anchor="middle">2-4 weeks: research,</text><text x="165.0" y="189" font-size="11" fill="#fff" font-weight="400" text-anchor="middle">personas, goals</text><line x1="270" y1="172" x2="290" y2="172" stroke="#C47A2A" stroke-width="2.5" marker-end="url(#ah)"/><rect x="290" y="130" width="210" height="84" rx="12" fill="#5AAB9D" stroke="none" stroke-width="1.5"/><text x="395.0" y="156" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">Launch Pad</text><text x="395.0" y="174" font-size="11" fill="#fff" font-weight="400" text-anchor="middle">~12 weeks: ship top</text><text x="395.0" y="189" font-size="11" fill="#fff" font-weight="400" text-anchor="middle">3-8 pages fast</text><line x1="500" y1="172" x2="520" y2="172" stroke="#C47A2A" stroke-width="2.5" marker-end="url(#ah)"/><rect x="520" y="130" width="210" height="84" rx="12" fill="#C47A2A" stroke="none" stroke-width="1.5"/><text x="625.0" y="156" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">Continuous</text><text x="625.0" y="174" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">Improvement</text><text x="625.0" y="192" font-size="11" fill="#fff" font-weight="400" text-anchor="middle">ongoing: data-driven</text><text x="625.0" y="207" font-size="11" fill="#fff" font-weight="400" text-anchor="middle">iteration</text><text x="400" y="255" font-size="12" fill="#6b7785" font-weight="400" text-anchor="middle">Launch sooner, then improve on real user data, not assumptions</text></svg>