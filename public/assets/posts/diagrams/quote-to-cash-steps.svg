<svg width="800" height="230" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" role="img" aria-label="Quote-to-cash process steps" font-family="DM Sans, Segoe UI, sans-serif"><rect width="800" height="230" fill="#f7f5f1"/><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#C47A2A"/></marker></defs><text x="400" y="30" font-size="16" fill="#213343" font-weight="700" text-anchor="middle">The Quote-to-Cash Process</text><rect x="22" y="110" width="120" height="64" rx="10" fill="#1A7AB5" stroke="none" stroke-width="1.5"/><text x="82.0" y="138" font-size="12.5" fill="#fff" font-weight="700" text-anchor="middle">CPQ</text><text x="82.0" y="155" font-size="12.5" fill="#fff" font-weight="700" text-anchor="middle">quote</text><line x1="142" y1="142" x2="150" y2="142" stroke="#C47A2A" stroke-width="2.5" marker-end="url(#ah)"/><rect x="150" y="110" width="120" height="64" rx="10" fill="#5AAB9D" stroke="none" stroke-width="1.5"/><text x="210.0" y="138" font-size="12.5" fill="#fff" font-weight="700" text-anchor="middle">Approve</text><text x="210.0" y="155" font-size="12.5" fill="#fff" font-weight="700" text-anchor="middle">+ sign</text><line x1="270" y1="142" x2="278" y2="142" stroke="#C47A2A" stroke-width="2.5" marker-end="url(#ah)"/><rect x="278" y="110" width="120" height="64" rx="10" fill="#D4960A" stroke="none" stroke-width="1.5"/><text x="338.0" y="148" font-size="12.5" fill="#fff" font-weight="700" text-anchor="middle">Order</text><line x1="398" y1="142" x2="406" y2="142" stroke="#C47A2A" stroke-width="2.5" marker-end="url(#ah)"/><rect x="406" y="110" width="120" height="64" rx="10" fill="#C47A2A" stroke="none" stroke-width="1.5"/><text x="466.0" y="148" font-size="12.5" fill="#fff" font-weight="700" text-anchor="middle">Fulfill</text><line x1="526" y1="142" x2="534" y2="142" stroke="#C47A2A" stroke-width="2.5" marker-end="url(#ah)"/><rect x="534" y="110" width="120" height="64" rx="10" fill