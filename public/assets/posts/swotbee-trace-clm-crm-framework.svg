<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SWOTBee TRACE control loop for CLM and CRM integration</title>
  <desc id="desc">Five connected controls: Truth, References, Actions, Containment and Evidence. Evidence feeds back into Truth as a continuous improvement loop.</desc>
  <rect width="1200" height="675" fill="#f7fafc"/>
  <text x="600" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">The SWOTBee TRACE Control Loop</text>
  <text x="600" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#526078">Five controls for reliable CLM and CRM integration</text>
  <g font-family="Arial, sans-serif">
    <path d="M235 250 H310 M485 250 H560 M735 250 H810 M985 250 H1060" fill="none" stroke="#65728a" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M1080 355 C1080 565 120 565 120 355" fill="none" stroke="#2f6fed" stroke-width="5" stroke-dasharray="12 9" marker-end="url(#arrowBlue)"/>

    <g transform="translate(60 175)">
      <rect width="175" height="180" rx="20" fill="#e7f0ff" stroke="#2f6fed" stroke-width="3"/>
      <circle cx="88" cy="54" r="29" fill="#2f6fed"/>
      <text x="88" y="65" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">T</text>
      <text x="88" y="110" text-anchor="middle" font-size="23" font-weight="700" fill="#172033">Truth</text>
      <text x="88" y="140" text-anchor="middle" font-size="16" fill="#45536c">field authority</text>
    </g>
    <g transform="translate(310 175)">
      <rect width="175" height="180" rx="20" fill="#efeaff" stroke="#7357d9" stroke-width="3"/>
      <circle cx="88" cy="54" r="29" fill="#7357d9"/>
      <text x="88" y="65" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">R</text>
      <text x="88" y="110" text-anchor="middle" font-size="23" font-weight="700" fill="#172033">References</text>
      <text x="88" y="140" text-anchor="middle" font-size="16" fill="#45536c">stable IDs</text>
    </g>
    <g transform="translate(560 175)">
      <rect width="175" height="180" rx="20" fill="#fff5db" stroke="#e5a000" stroke-width="3"/>
      <circle cx="88" cy="54" r="29" fill="#e5a000"/>
      <text x="88" y="65" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">A</text>
      <text x="88" y="110" text-anchor="middle" font-size="23" font-weight="700" fill="#172033">Actions</text>
      <text x="88" y="140" text-anchor="middle" font-size="16" fill="#45536c">business events</text>
    </g>
    <g transform="translate(810 175)">
      <rect width="175" height="180" rx="20" fill="#fff0f0" stroke="#c93d46" stroke-width="3"/>
      <circle cx="88" cy="54" r="29" fill="#c93d46"/>
      <text x="88" y="65" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">C</text>
      <text x="88" y="110" text-anchor="middle" font-size="23" font-weight="700" fill="#172033">Containment</text>
      <text x="88" y="140" text-anchor="middle" font-size="16" fill="#45536c">retry + quarantine</text>
    </g>
    <g transform="translate(1060 175)">
      <rect width="100" height="180" rx="20" fill="#e9f8ef" stroke="#159455" stroke-width="3"/>
      <circle cx="50" cy="54" r="29" fill="#159455"/>
      <text x="50" y="65" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">E</text>
      <text x="50" y="110" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">Evidence</text>
      <text x="50" y="140" text-anchor="middle" font-size="14" fill="#45536c">reconcile</text>
    </g>

    <rect x="325" y="475" width="550" height="82" rx="18" fill="#ffffff" stroke="#c7d0df" stroke-width="2"/>
    <text x="600" y="510" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">Evidence improves the next design cycle</text>
    <text x="600" y="539" text-anchor="middle" font-size="17" fill="#45536c">Correct the control, not only the failed record</text>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#65728a"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fed"/></marker>
  </defs>
</svg>
