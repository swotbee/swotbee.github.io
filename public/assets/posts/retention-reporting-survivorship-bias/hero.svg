<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Survivorship bias in NRR reporting</title>
  <desc id="desc">A rising retention percentage overlays a sharply shrinking customer base, illustrating the CFO reporting trap.</desc>
  <rect width="800" height="450" rx="24" fill="#f7f5f1"/>
  <rect x="52" y="48" width="696" height="354" rx="22" fill="#ffffff" stroke="#d9e1e5" stroke-width="2"/>
  <text x="88" y="105" fill="#213343" font-family="Arial, sans-serif" font-size="22" font-weight="700">The rate improved. Retention did not.</text>
  <text x="88" y="137" fill="#60717d" font-family="Arial, sans-serif" font-size="15">Aggregate retention</text>
  <path d="M105 305 C210 285 270 245 360 225 S520 160 685 135" fill="none" stroke="#1A7AB5" stroke-width="8" stroke-linecap="round"/>
  <circle cx="105" cy="305" r="8" fill="#1A7AB5"/>
  <circle cx="685" cy="135" r="8" fill="#1A7AB5"/>
  <text x="83" y="338" fill="#1A7AB5" font-family="Arial, sans-serif" font-size="18" font-weight="700">45%</text>
  <text x="662" y="118" fill="#1A7AB5" font-family="Arial, sans-serif" font-size="18" font-weight="700">70%</text>
  <g fill="#C47A2A">
    <rect x="103" y="350" width="96" height="16" rx="8"/>
    <rect x="216" y="350" width="72" height="16" rx="8"/>
    <rect x="305" y="350" width="52" height="16" rx="8"/>
    <rect x="374" y="350" width="38" height="16" rx="8"/>
    <rect x="429" y="350" width="25" height="16" rx="8"/>
  </g>
  <text x="490" y="365" fill="#8a5721" font-family="Arial, sans-serif" font-size="15" font-weight="700">1,000 customers to 84</text>
  <text x="88" y="392" fill="#60717d" font-family="Arial, sans-serif" font-size="13">A rising percentage can be a customer-mix effect, not genuine improvement.</text>
</svg>
