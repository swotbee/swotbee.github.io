<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Seven-slide HubSpot board report structure</title>
  <desc id="desc">Seven numbered cards show a decision-focused board report from executive summary through decisions and owners.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f2e8"/><stop offset="1" stop-color="#eaf4f2"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173f3a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <text x="70" y="75" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#173f3a">The seven-slide board reporting narrative</text>
  <text x="70" y="114" font-family="Arial, sans-serif" font-size="19" fill="#5c716d">Each slide answers one board-level question and ends in evidence or action.</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(70 165)"><rect width="245" height="145" rx="20" fill="#173f3a"/><circle cx="37" cy="37" r="20" fill="#fff"/><text x="37" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#173f3a">1</text><text x="25" y="88" font-size="21" font-weight="700" fill="#fff">Summary + asks</text><text x="25" y="119" font-size="16" fill="#cfe2df">What needs attention?</text></g>
    <g transform="translate(340 165)"><rect width="245" height="145" rx="20" fill="#fff"/><circle cx="37" cy="37" r="20" fill="#df6c3f"/><text x="37" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">2</text><text x="25" y="88" font-size="21" font-weight="700" fill="#173f3a">Revenue + target</text><text x="25" y="119" font-size="16" fill="#5c716d">Are we on plan?</text></g>
    <g transform="translate(610 165)"><rect width="245" height="145" rx="20" fill="#fff"/><circle cx="37" cy="37" r="20" fill="#d1a42e"/><text x="37" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">3</text><text x="25" y="88" font-size="21" font-weight="700" fill="#173f3a">Forecast + cover</text><text x="25" y="119" font-size="16" fill="#5c716d">What is likely next?</text></g>
    <g transform="translate(880 165)"><rect width="250" height="145" rx="20" fill="#fff"/><circle cx="37" cy="37" r="20" fill="#347f76"/><text x="37" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">4</text><text x="25" y="88" font-size="21" font-weight="700" fill="#173f3a">Pipeline change</text><text x="25" y="119" font-size="16" fill="#5c716d">What moved and why?</text></g>
    <g transform="translate(205 345)"><rect width="245" height="145" rx="20" fill="#fff"/><circle cx="37" cy="37" r="20" fill="#b95b3a"/><text x="37" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">5</text><text x="25" y="88" font-size="21" font-weight="700" fill="#173f3a">Health + risks</text><text x="25" y="119" font-size="16" fill="#5c716d">What may fail?</text></g>
    <g transform="translate(475 345)"><rect width="245" height="145" rx="20" fill="#fff"/><circle cx="37" cy="37" r="20" fill="#6f7fa3"/><text x="37" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">6</text><text x="25" y="88" font-size="21" font-weight="700" fill="#173f3a">Drivers + segments</text><text x="25" y="119" font-size="16" fill="#5c716d">What explains results?</text></g>
    <g transform="translate(745 345)"><rect width="245" height="145" rx="20" fill="#173f3a"/><circle cx="37" cy="37" r="20" fill="#f4c95d"/><text x="37" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#173f3a">7</text><text x="25" y="88" font-size="21" font-weight="700" fill="#fff">Decisions + owners</text><text x="25" y="119" font-size="16" fill="#cfe2df">What happens next?</text></g>
  </g>
  <text x="600" y="557" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#28766c">One definition. One cutoff. One reconciled source for every headline.</text>
</svg>
