<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000"><title>Plan Do Study Act cycle</title><desc>Plan leads clockwise to Do, Study, Act and back to Plan, centred on your team's priorities.</desc><rect width="1000" height="1000" fill="#f8f5f0"/><path d="M 197.97,457.55 L 100.24,486.04 A 400 400 0 0 1 486.04,100.24 L 542.45,197.97 L 492.67,290.13 A 210 210 0 0 0 290.13,492.67 Z" fill="#315f77" stroke="#f8f5f0" stroke-width="10" stroke-linejoin="round"/><path d="M 542.45,197.97 L 513.96,100.24 A 400 400 0 0 1 899.76,486.04 L 802.03,542.45 L 709.87,492.67 A 210 210 0 0 0 507.33,290.13 Z" fill="#2b665c" stroke="#f8f5f0" stroke-width="10" stroke-linejoin="round"/><path d="M 802.03,542.45 L 899.76,513.96 A 400 400 0 0 1 513.96,899.76 L 457.55,802.03 L 507.33,709.87 A 210 210 0 0 0 709.87,507.33 Z" fill="#99571e" stroke="#f8f5f0" stroke-width="10" stroke-linejoin="round"/><path d="M 457.55,802.03 L 486.04,899.76 A 400 400 0 0 1 100.24,513.96 L 197.97,457.55 L 290.13,507.33 A 210 210 0 0 0 492.67,709.87 Z" fill="#183b4a" stroke="#f8f5f0" stroke-width="10" stroke-linejoin="round"/><text x="290" y="290" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="49" fill="#ffffff">PLAN</text><text x="710" y="290" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="49" fill="#ffffff">DO</text><text x="710" y="710" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="49" fill="#ffffff">STUDY</text><text x="290" y="710" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="49" fill="#ffffff">ACT</text><g text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="39" fill="#20343e"><text x="500" y="485">Your team's</text><text x="500" y="539">priorities</text></g></svg>